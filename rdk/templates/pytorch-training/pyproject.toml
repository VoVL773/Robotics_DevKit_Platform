[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "{{package_name}}"
version = "0.1.0"
description = "Standalone CPU PyTorch classification example"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 训练测试不使用 ROS Launch 插件，避免混合终端环境引入额外 ROS 依赖。
addopts = "-p no:launch_testing -p no:launch_ros"
